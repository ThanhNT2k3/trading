name: Build and deploy Next.js app to Azure Web App - vn2000

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"
  AZURE_WEBAPP_NAME: vn2000

jobs:
  build:
    name: Build Next.js standalone app
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Prepare standalone deployment package
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.scripts = { start: 'node server.js' }; delete pkg.devDependencies; fs.writeFileSync('.next/standalone/package.json', JSON.stringify(pkg, null, 2));"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone
          path: .next/standalone

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: nextjs-standalone
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_32EFABAC80624C04B9C0DEEE9952D38A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_77256B4A3FF14823B8EAD351B55FA864 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C70B9061D2A84C9AA289E27944C16387 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
