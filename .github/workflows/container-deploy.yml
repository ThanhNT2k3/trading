name: Build and Deploy Container to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  AZURE_WEBAPP_NAME: vn2500
  REGISTRY_NAME: vnindexregistry  # Change to your ACR name
  IMAGE_NAME: nextjs-admin-dashboard

jobs:
  build-and-push:
    name: Build and Push Docker Image to ACR
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set ACR registry URL
        id: acr
        run: |
          echo "registry_url=${{ env.REGISTRY_NAME }}.azurecr.io" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: azure/acr-build@v1
        with:
          service: ${{ secrets.AZURE_REGISTRY_NAME }}
          image: ${{ env.IMAGE_NAME }}
          dockerfile: ./Dockerfile
          branch: main
          git_access_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-app-service:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          images: ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          startup-command: node server.js
